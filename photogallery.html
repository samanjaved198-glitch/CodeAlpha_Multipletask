<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Gallery </title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f11;
      color: #f0ede8;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      padding: 20px 40px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      background: rgba(15,15,17,0.9);
      backdrop-filter: blur(16px);
      z-index: 100;
    }

    .logo { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .logo span { color: #d4a96a; }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; }

    .fbtn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.5);
      padding: 6px 18px;
      border-radius: 100px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
    }

    .fbtn:hover { border-color: #d4a96a; color: #d4a96a; }

    .fbtn.active {
      background: #d4a96a;
      border-color: #d4a96a;
      color: #0f0f11;
      font-weight: 600;
    }

    .hero { padding: 56px 40px 32px; }
    .hero-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.2em; color: #d4a96a; margin-bottom: 10px; }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; line-height: 1.1; margin-bottom: 12px; }
    .hero h1 em { font-style: italic; color: #d4a96a; }
    .hero p { color: rgba(255,255,255,0.45); font-size: 15px; max-width: 400px; line-height: 1.7; }

    .gallery-section { padding: 0 40px 80px; }

    .count {
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .grid { columns: 3; column-gap: 12px; }

    .item {
      break-inside: avoid;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      animation: fadeUp 0.45s ease both;
    }

    .item:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.5); }

    .item img { width: 100%; display: block; transition: transform 0.55s ease; }
    .item:hover img { transform: scale(1.06); }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      align-items: flex-end;
      padding: 14px;
    }

    .item:hover .overlay { opacity: 1; }

    .ov-cat { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: #d4a96a; margin-bottom: 3px; }
    .ov-title { font-size: 14px; font-weight: 600; color: #fff; }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(5,5,7,0.95);
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(20px);
    }

    .lightbox.open { display: flex; }

    .lb-box {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      max-width: 1100px;
      width: 95%;
      padding: 20px;
      position: relative;
    }

    .lb-close {
      position: absolute;
      top: -8px;
      right: 12px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .lb-close:hover { background: rgba(255,255,255,0.2); }

    .lb-img-area { flex: 1; min-width: 0; position: relative; }

    .lb-img-area img {
      width: 100%;
      max-height: 72vh;
      object-fit: contain;
      border-radius: 8px;
      display: block;
      transition: filter 0.3s;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
      user-select: none;
      z-index: 2;
    }

    .nav-btn:hover { background: #d4a96a; border-color: #d4a96a; color: #111; }
    .nav-prev { left: 8px; }
    .nav-next { right: 8px; }

    .lb-side { width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 18px; }

    .lb-cat { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: #d4a96a; margin-bottom: 6px; }
    .lb-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .lb-desc { font-size: 13px; color: rgba(255,255,255,0.45); line-height: 1.7; }

    .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.3); margin-bottom: 8px; }

    .img-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    .iff {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: rgba(255,255,255,0.55);
      font-size: 12px;
      padding: 6px 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      font-family: inherit;
    }

    .iff:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .iff.active { background: #d4a96a; border-color: #d4a96a; color: #111; font-weight: 600; }

    .thumbs { display: flex; gap: 5px; flex-wrap: wrap; }

    .thumb {
      width: 44px;
      height: 44px;
      border-radius: 5px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.45;
      transition: all 0.2s;
    }

    .thumb.active { border-color: #d4a96a; opacity: 1; }
    .thumb:hover { opacity: 0.8; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .lb-counter { font-size: 12px; color: rgba(255,255,255,0.25); text-align: center; }

    @media (max-width: 860px) {
      header { padding: 16px 20px; }
      .hero { padding: 40px 20px 24px; }
      .gallery-section { padding: 0 20px 60px; }
      .grid { columns: 2; }
      .lb-box { flex-direction: column; }
      .lb-side { width: 100%; }
    }

    @media (max-width: 500px) {
      .grid { columns: 2; }
      .hero h1 { font-size: 1.8rem; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Photo<span>Gallery</span></div>
  <div class="filters" id="filters">
    <button class="fbtn active" data-f="all">All</button>
    <button class="fbtn" data-f="nature">Nature</button>
    <button class="fbtn" data-f="architecture">Architecture</button>
    <button class="fbtn" data-f="portrait">Portrait</button>
    <button class="fbtn" data-f="abstract">Abstract</button>
  </div>
</header>

<div class="hero">
  <p class="hero-label"></p>
  <h1>Explore the world<br>through <em>light.</em></h1>
  <p>Click any image to open the full viewer. Use the filter buttons to browse by category.</p>
</div>

<section class="gallery-section">
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</section>

<div class="lightbox" id="lightbox">
  <div class="lb-box">
    <div class="lb-close" id="lb-close">&#215;</div>
    <div class="lb-img-area">
      <div class="nav-btn nav-prev" id="prev">&#8249;</div>
      <img id="lb-img" src="" alt="" />
      <div class="nav-btn nav-next" id="next">&#8250;</div>
    </div>
    <div class="lb-side">
      <div>
        <div class="lb-cat" id="lb-cat"></div>
        <div class="lb-title" id="lb-title"></div>
        <div class="lb-desc" id="lb-desc"></div>
      </div>
      <div>
        <div class="section-label">Image Filters</div>
        <div class="img-filters" id="img-filters">
          <button class="iff active" data-v="none">Original</button>
          <button class="iff" data-v="grayscale(1)">B&amp;W</button>
          <button class="iff" data-v="sepia(0.8)">Sepia</button>
          <button class="iff" data-v="contrast(1.4) saturate(1.5)">Vivid</button>
          <button class="iff" data-v="hue-rotate(180deg)">Hue Shift</button>
          <button class="iff" data-v="brightness(1.2) blur(0.4px)">Soft</button>
        </div>
      </div>
      <div>
        <div class="section-label">Thumbnails</div>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <div class="lb-counter" id="lb-counter"></div>
    </div>
  </div>
</div>

    { url:'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=700&q=80', title:'Profile',          cat:'portrait',      desc:'Confidence rendered in a single direct gaze.' },
  ];

  let filtered = [...IMGS];
  let cur = 0;
  let cssFilter = 'none';

  const grid      = document.getElementById('grid');
  const countEl   = document.getElementById('count');
  const lightbox  = document.getElementById('lightbox');
  const lbImg     = document.getElementById('lb-img');
  const lbCat     = document.getElementById('lb-cat');
  const lbTitle   = document.getElementById('lb-title');
  const lbDesc    = document.getElementById('lb-desc');
  const lbCounter = document.getElementById('lb-counter');
  const thumbsEl  = document.getElementById('thumbs');

  function buildGrid() {
    const f = document.querySelector('.fbtn.active').dataset.f;
    filtered = f === 'all' ? [...IMGS] : IMGS.filter(i => i.cat === f);
    countEl.textContent = filtered.length + ' image' + (filtered.length !== 1 ? 's' : '');
    grid.innerHTML = '';
    filtered.forEach((img, i) => {
      const d = document.createElement('div');
      d.className = 'item';
      d.style.animationDelay = (i * 55) + 'ms';
      d.innerHTML = `
        <img src="${img.url}" alt="${img.title}" loading="lazy" />
        <div class="overlay">
          <div>
            <div class="ov-cat">${img.cat}</div>
            <div class="ov-title">${img.title}</div>
          </div>
        </div>`;
      d.addEventListener('click', () => openLb(i));
      grid.appendChild(d);
    });
    buildThumbs();
  }

  function buildThumbs() {
    thumbsEl.innerHTML = '';
    filtered.forEach((img, i) => {
      const t = document.createElement('div');
      t.className = 'thumb' + (i === cur ? ' active' : '');
      t.innerHTML = `<img src="${img.url}" alt="${img.title}" />`;
      t.addEventListener('click', () => goTo(i));
      thumbsEl.appendChild(t);
    });
  }

  function updateThumbs() {
    document.querySelectorAll('.thumb').forEach((t, i) =>
      t.classList.toggle('active', i === cur));
    const a = thumbsEl.children[cur];
    if (a) a.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }

  function openLb(i) {
    cur = i;
    cssFilter = 'none';
    document.querySelectorAll('.iff').forEach(b =>
      b.classList.toggle('active', b.dataset.v === 'none'));
    updateLb();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLb() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  function updateLb() {
    const img = filtered[cur];
    lbImg.src = img.url;
    lbImg.alt = img.title;
    lbImg.style.filter = cssFilter === 'none' ? '' : cssFilter;
    lbCat.textContent = img.cat;
    lbTitle.textContent = img.title;
    lbDesc.textContent = img.desc;
    lbCounter.textContent = (cur + 1) + ' / ' + filtered.length;
    updateThumbs();
  }

  function goTo(i) {
    cur = (i + filtered.length) % filtered.length;
    updateLb();
  }

  document.getElementById('prev').addEventListener('click', () => goTo(cur - 1));
  document.getElementById('next').addEventListener('click', () => goTo(cur + 1));
  document.getElementById('lb-close').addEventListener('click', closeLb);
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLb(); });

  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('.fbtn');
    if (!b) return;
    document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    buildGrid();
  });

  document.getElementById('img-filters').addEventListener('click', e => {
    const b = e.target.closest('.iff');
    if (!b) return;
    cssFilter = b.dataset.v;
    document.querySelectorAll('.iff').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    lbImg.style.filter = cssFilter === 'none' ? '' : cssFilter;
  });

  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'ArrowRight') goTo(cur + 1);
    if (e.key === 'ArrowLeft')  goTo(cur - 1);
    if (e.key === 'Escape')     closeLb();
  });

  buildGrid();
</script>
